name: wantedhacker

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.4.5}
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    # Local-only data dependency; no Elasticsearch port is published to the host.
    mem_limit: 1536m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl --fail --silent "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null',
        ]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  server:
    build:
      context: ${SERVER_SOURCE_DIR:-../03_wantedhacker-server}
      target: runner
    environment:
      SPRING_PROFILES_ACTIVE: local
      ES_URIS: http://elasticsearch:9200
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65.0
    ports:
      - '127.0.0.1:${SERVER_PORT:-8080}:8080'
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 1g
    init: true

  web:
    build:
      context: .
      target: runner
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      WANTEDHACKER_SERVER_URL: http://server:8080
      INTERVIEW_AI_ENABLED: ${INTERVIEW_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INTERVIEW_MODEL: ${OPENAI_INTERVIEW_MODEL:-}
    depends_on:
      server:
        condition: service_healthy
    init: true

  dev:
    profiles: [dev]
    build:
      context: .
      target: development
    ports:
      - '127.0.0.1:${DEV_PORT:-3001}:3000'
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true'
      WANTEDHACKER_SERVER_URL: http://server:8080
      INTERVIEW_AI_ENABLED: ${INTERVIEW_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INTERVIEW_MODEL: ${OPENAI_INTERVIEW_MODEL:-}
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
      - dev_npm_cache:/root/.npm
    # Refresh dependencies on startup so lockfile updates cannot leave a stale volume.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --webpack"
    init: true

  test:
    profiles: [test]
    build:
      context: .
      target: development
    environment:
      NODE_ENV: test
    command: sh -c "npm test && npm run lint && npx next typegen && npm run typecheck"
    init: true

  server-test:
    profiles: [test]
    build:
      context: ${SERVER_SOURCE_DIR:-../03_wantedhacker-server}
      target: test
    environment:
      SPRING_PROFILES_ACTIVE: local
      ES_URIS: http://elasticsearch:9200
    volumes:
      - server_gradle_cache:/opt/gradle-cache
    depends_on:
      elasticsearch:
        condition: service_healthy
    init: true

  integration-test:
    profiles: [test]
    build:
      context: .
      target: development
    # Use the web container's loopback so the local-only fixture script stays local-only.
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
    command: [node, --import, tsx, scripts/test-synthetic-resumes.ts, 'http://127.0.0.1:3000']
    init: true

volumes:
  elasticsearch_data:
  server_gradle_cache:
  dev_node_modules:
  dev_next:
  dev_npm_cache:
